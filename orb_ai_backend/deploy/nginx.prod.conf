# --------------------------------------------------------------------------
# Production Nginx configuration for the self-hosted ORB AI backend.
# --------------------------------------------------------------------------
# Place at: /etc/nginx/sites-available/orb_ai
# Enable:   ln -s /etc/nginx/sites-available/orb_ai /etc/nginx/sites-enabled/orb_ai
# Reload:   nginx -t && systemctl reload nginx
#
# Assumes:
#   - The API container binds to 127.0.0.1:8000 (see docker-compose.prod.yml).
#   - Let's Encrypt certs live under /etc/letsencrypt/live/api.yourdomain.com/
#     (issued via: certbot --nginx -d api.yourdomain.com).
#   - You've added the rate-limit / connection-limit zones to nginx.conf's
#     `http { }` block (see the top of this file).
#
# To be added ONCE inside /etc/nginx/nginx.conf `http {}`:
#
#   limit_req_zone  $binary_remote_addr zone=orb_api:10m       rate=20r/s;
#   limit_req_zone  $binary_remote_addr zone=orb_auth:10m      rate=5r/s;
#   limit_conn_zone $binary_remote_addr zone=orb_conn:10m;
#
# --------------------------------------------------------------------------

# ---- HTTP → HTTPS redirect (also serves the ACME challenge) --------------
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS reverse proxy -------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ---- Body & buffer sizing ----
    client_max_body_size    5m;
    client_body_buffer_size 128k;

    # Global per-IP connection cap.
    limit_conn orb_conn 40;

    # ---- WebSocket endpoints (long-lived; large read timeouts) -----------
    location ~ ^/api/v1/ws(/|$) {
        # WebSockets are per-user, admin-role checked in-app — no auth rate limit,
        # but keep a low reasonable connection cap via the global zone above.
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WS heartbeats prevent this from firing in practice, but keep it
        # generous for long-lived connections.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 60s;
    }

    # ---- Auth endpoints (strict per-IP rate limit) -----------------------
    location ~ ^/api/v1/auth(/|$) {
        limit_req zone=orb_auth burst=10 nodelay;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Admin dashboard static assets (long-cache) ----------------------
    location /api/admin-ui/assets/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_valid  200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Everything else (REST API + admin SPA fallback) -----------------
    location / {
        limit_req zone=orb_api burst=40 nodelay;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Small buffering for JSON APIs.
        proxy_buffers        16 8k;
        proxy_buffer_size    16k;
    }

    # ---- Deny hidden files ----
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# --------------------------------------------------------------------------
# Add to /etc/nginx/nginx.conf `http {}` if not already present:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# --------------------------------------------------------------------------
